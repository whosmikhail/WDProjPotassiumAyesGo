<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot & Learn: Create Flashcard</title>

        <link rel="stylesheet" href="../index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">
</head>

<body onload="update()">

<div class="create-page">

    <div class="body-container">
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="game.html">Play!</a></li>
                <li><a href="collect.html">Collection</a></li>
                <li><a href="gacha.html">Gacha</a></li>
            </ul>
        </nav>

        <div class="flashcard-container" id="flashcard-container">
            <label style="color: white" id="group-name" onclick="RenameGroup()" for="group">GROUP 1:</label>
            <div class="group-selected" id="group">
                <div class="flashcard" id="zilch">
                    <p></p>
                    <p style="opacity: 0;"></p>
                    <button onclick="RevealAnswer(this)">Reveal Answer</button>
                </div>
            </div>
        </div>

        <button id="group-delete" onclick="DeleteGroup()">Delete Group:</button>
        <button id="group-make" onclick="MakeGroup()">New Group:</button>
        <button id="group-select" onclick="SelectGroup()">Edit Group:</button>
    </div>

    <form class="create-container" id="create-container">
        <div class="flashcard" id="plus">
            <label for="Question">Question:</label>
            <input class="Question" id="Question" type="text">
            <label for="Answer">Answer:</label>
            <input class="Answer" id="Answer" type="text">
        </div>

        <input list="card-themes" id="card-theme">
        <datalist id="card-themes">
            <option value="Red" class="Red">Red</option>
            <option value="Blue" class="Blue">Blue</option>
        </datalist>

        <input type="submit">
    </form>
    
</div>

<script src="../index.js"></script>



</body>
</html>
